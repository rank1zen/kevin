name: Test Code Quality

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint Source Code
    runs-on: ubuntu-latest
    steps:
      - uses: 'actions/checkout@v7'
      - uses: 'actions/setup-go@v6'
        with:
          go-version: '1.27'
      - uses: 'golangci/golangci-lint-action@v9'
        with:
          version: 'v2.12'

  test:
    name: Test Source Code
    runs-on: ubuntu-latest
    steps:
      - uses: 'actions/checkout@v7'
      - uses: 'actions/setup-go@v6'
        with:
          go-version: '1.27'
      - run: 'go test ./...'
