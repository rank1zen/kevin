[tools]
"aqua:tailwindlabs/tailwindcss" = "latest"
"cargo:rustywind" = "latest"
go = "1.25"
golangci-lint = "latest"

[env]
# Application settings
KEVIN_PORT = 7331
KEVIN_ENV = "dev"
KEVIN_DATABASE_URL = ""
KEVIN_RIOT_API_KEY = ""

# GCP settings
GCP_REGION = ""
GCP_PROJECT_ID = ""

# GCP Artifact Registry settings
GCP_GAR_LOCATION = ""
GCP_GAR_REPOSITORY = ""
GCP_GAR_IMAGE = ""
GCP_GAR_TAG = ""

# GCP Cloud SQL settings
GCP_CLOUDSQL_INSTANCE = ""

# GCP Secret Manager settings
GCP_SECRET_KEVIN_DATABASE_URL = ""
GCP_SECRET_KEVIN_RIOT_API_KEY = ""

# Tern migrator settings
TERN_CONFIG = "./tern.conf"
TERN_MIGRATIONS = "./migrations"
